# 在 http 内仅包含一次，供 IP 和正式域名入口共用。
# HTML 默认支持 gzip；图片等已压缩格式不重复压缩。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types application/javascript application/json text/css image/svg+xml;

# 只有 Vite 带内容指纹的脚本和样式可长期缓存，更新内容会生成新地址。
# 固定文件名素材仍须向服务器验证，避免替换图片后继续显示旧内容。
map $uri $jyj_asset_cache {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}
