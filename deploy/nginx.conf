# 放入 nginx.conf 的 http 内（通常为 /etc/nginx/conf.d/jianyanji.conf）。
# 替换 example.com 和证书路径；配套文件见 deploy/nginx/，后端仅监听 127.0.0.1。
limit_req_zone $binary_remote_addr zone=jyj_api_ip:10m rate=10r/s;
limit_req_zone $server_name zone=jyj_api_total:1m rate=50r/s;
limit_req_zone $binary_remote_addr zone=jyj_login_ip:1m rate=5r/m;
limit_req_zone $server_name zone=jyj_login_total:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=jyj_wechat_ip:1m rate=30r/m;
limit_req_zone $server_name zone=jyj_wechat_total:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=jyj_assets_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jyj_notify_ip:1m rate=30r/s;
limit_req_zone $server_name zone=jyj_notify_total:1m rate=20r/s;
map $request_method $jyj_write_ip {
    default $binary_remote_addr;
    GET "";
    HEAD "";
    OPTIONS "";
}
limit_req_zone $jyj_write_ip zone=jyj_write_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=jyj_connections:10m;

# 不记查询串、Cookie、Authorization、请求正文和凭证；保留边缘及应用请求号。
log_format jyj_security escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"requestId":"$request_id","appRequestId":"$upstream_http_x_request_id",'
    '"limit":"$limit_req_status","seconds":$request_time}';

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name example.com;
    return 301 https://example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host != example.com) { return 444; }

    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    reset_timedout_connection on;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    access_log /var/log/nginx/jianyanji-access.log jyj_security buffer=32k flush=5s;
    error_log /var/log/nginx/jianyanji-error.log warn;

    include /etc/nginx/jianyanji/blocked-ips.conf;
    # 覆盖客户端提供的转发头，不能沿用外部提供的代理链。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;

    error_page 429 = @jyj_rate_limited;
    error_page 503 = @jyj_paused;

    location = /api/admin/login {
        include /etc/nginx/jianyanji/api-guard.conf;
        limit_req zone=jyj_login_ip burst=5 nodelay;
        limit_req zone=jyj_login_total burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location = /api/auth/wechat {
        include /etc/nginx/jianyanji/api-guard.conf;
        limit_req zone=jyj_wechat_ip burst=15 nodelay;
        limit_req zone=jyj_wechat_total burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    # 生产不允许绕过微信登录；Java 内部仍须设置 DEV_AUTH=false。
    location = /api/auth/dev { return 404; }

    # 回调独立限流，不受商城 API 暂停开关和普通写请求限流影响。
    location = /api/payments/wechat/notify {
        limit_req zone=jyj_notify_ip burst=60 nodelay;
        limit_req zone=jyj_notify_total burst=100 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location /api/ {
        include /etc/nginx/jianyanji/api-guard.conf;
        limit_req zone=jyj_write_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location /assets/ {
        # 压缩前端脚本和样式，减少首次加载的传输量。
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types application/javascript text/css image/svg+xml;
        if (-f /etc/nginx/jianyanji/pause-assets) { return 503; }
        limit_req zone=jyj_assets_ip burst=60 nodelay;
        limit_conn jyj_connections 40;
        proxy_pass http://127.0.0.1:3100;
    }
    location / {
        limit_req zone=jyj_api_ip burst=20 nodelay;
        limit_conn jyj_connections 20;
        proxy_pass http://127.0.0.1:3100;
    }
    location @jyj_rate_limited {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        add_header X-Request-ID $request_id always;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"访问过于频繁，请稍后再试","requestId":"$request_id"}';
    }
    location @jyj_paused {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        add_header X-Request-ID $request_id always;
        return 503 '{"code":"SERVICE_PAUSED","message":"服务临时维护中，请稍后再试","requestId":"$request_id"}';
    }
}
